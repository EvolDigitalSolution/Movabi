server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location ^~ /api/payment/driver-topup/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $wallet_api http://movabi-develop-api:3001;
    proxy_pass $wallet_api;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    add_header Cache-Control "no-store";
  }
  location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store, no-cache, must-revalidate"; }
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|map)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
